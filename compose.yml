services:
  app: 
    build: .
    # restart: unless-stopped
    restart: on-failure
    ports:
      - 3004:3004 
    environment:
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - PORT=${PORT}
      - NODE_ENV=docker
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - .:/app/node_modules
      - real-node-modules:/app/node_modules
  
  db:
    image: postgres:16
    restart: unless-stopped
    # ports:
    #   - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # start_period: 5s

volumes:
  real-node-modules:
  postgres-data:



    